<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Studio Klarzeit</title>
  <script>
    // GitHub Pages SPA fallback:
    // GitHub serves this with a 404 status for unknown paths.
    // We encode the original path and redirect to root where the SPA picks it up.
    var path = location.pathname + location.search + location.hash;
    location.replace('/?__path=' + encodeURIComponent(path));
  </script>
</head>
<body></body>
</html>
